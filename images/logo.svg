<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <!-- "parker" text in dark navy -->
  <text x="10" y="52" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#1B3A5C" letter-spacing="1">parker</text>
  <!-- "kitchens" text in lighter blue-grey -->
  <text x="162" y="52" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" font-weight="300" fill="#5A7FA0" letter-spacing="1">kitchens</text>
  <!-- Diamond pattern (4 diamonds in a larger diamond shape) -->
  <g transform="translate(310, 38)">
    <!-- Top diamond -->
    <polygon points="0,-18 10,-8 0,2 -10,-8" fill="#1B3A5C"/>
    <!-- Right diamond -->
    <polygon points="10,-8 20,2 10,12 0,2" fill="#2E5B8A"/>
    <!-- Bottom diamond -->
    <polygon points="0,2 10,12 0,22 -10,12" fill="#1B3A5C"/>
    <!-- Left diamond -->
    <polygon points="-10,-8 0,2 -10,12 -20,2" fill="#2E5B8A"/>
  </g>
</svg>